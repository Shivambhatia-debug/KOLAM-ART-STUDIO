<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Kolam Frontend Test</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .controls {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        
        .control-group {
            display: inline-block;
            margin: 10px 20px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .control-group input {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            background: rgba(255,255,255,0.9);
            color: #333;
            width: 80px;
        }
        
        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .canvas-container {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        
        #kolamCanvas {
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            background: black;
        }
        
        .pattern-info {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            margin-top: 20px;
        }
        
        .pattern-info h3 {
            margin-top: 0;
            color: #ffd700;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .info-item {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
        }
        
        .info-item strong {
            color: #ffd700;
        }
        
        .loading {
            display: none;
            color: #ffd700;
            font-size: 1.2em;
            margin: 20px 0;
        }
        
        .error {
            color: #ff6b6b;
            background: rgba(255,107,107,0.1);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 Spiral Kolam Generator</h1>
            <p>Animated Spiral Pattern with Dotted Squares</p>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label for="turns">Turns:</label>
                <input type="number" id="turns" value="6" min="3" max="12">
            </div>
            
            <div class="control-group">
                <label for="stepAngle">Step Angle:</label>
                <input type="number" id="stepAngle" value="15" min="5" max="30">
            </div>
            
            <div class="control-group">
                <label for="stepLength">Step Length:</label>
                <input type="number" id="stepLength" value="8" min="3" max="15">
            </div>
            
            <br>
            <button class="btn" onclick="generateSpiralKolam()">🎨 Generate Spiral Kolam</button>
            <button class="btn" onclick="animatePattern()">✨ Animate Pattern</button>
        </div>
        
        <div class="loading" id="loading">
            ⏳ Generating beautiful spiral pattern...
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="canvas-container">
            <canvas id="kolamCanvas" width="800" height="600"></canvas>
        </div>
        
        <div class="pattern-info" id="patternInfo" style="display: none;">
            <h3>📊 Pattern Information</h3>
            <div class="info-grid" id="infoGrid"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('kolamCanvas');
        const ctx = canvas.getContext('2d');
        let currentPattern = null;
        let animationId = null;
        
        // Set canvas background
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        async function generateSpiralKolam() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const patternInfo = document.getElementById('patternInfo');
            
            loading.style.display = 'block';
            error.style.display = 'none';
            patternInfo.style.display = 'none';
            
            try {
                const turns = parseInt(document.getElementById('turns').value);
                const stepAngle = parseInt(document.getElementById('stepAngle').value);
                const stepLength = parseInt(document.getElementById('stepLength').value);
                
                const response = await fetch('http://localhost:5000/api/generate-spiral-kolam', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        turns: turns,
                        step_angle: stepAngle,
                        step_length: stepLength,
                        animation: true
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentPattern = data.pattern;
                    drawSpiralPattern(currentPattern);
                    displayPatternInfo(currentPattern);
                    loading.style.display = 'none';
                } else {
                    throw new Error(data.message || 'Failed to generate pattern');
                }
            } catch (err) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = `Error: ${err.message}`;
            }
        }
        
        function drawSpiralPattern(pattern) {
            // Clear canvas
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            const metadata = pattern.metadata;
            const turns = metadata.turns;
            const stepAngle = metadata.step_angle;
            const stepLength = metadata.step_length;
            const totalSteps = metadata.total_steps;
            
            // Draw spiral
            ctx.strokeStyle = metadata.colors.spiral;
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            let x = centerX;
            let y = centerY;
            let angle = 0;
            
            for (let i = 0; i < totalSteps; i++) {
                ctx.lineTo(x, y);
                
                // Move forward
                x += Math.cos(angle * Math.PI / 180) * stepLength;
                y += Math.sin(angle * Math.PI / 180) * stepLength;
                angle += stepAngle;
                
                // Draw dotted squares every 15 steps
                if (i % 15 === 0 && i > 5) {
                    drawDottedSquare(x, y, 15, 3);
                }
            }
            
            ctx.stroke();
        }
        
        function drawDottedSquare(x, y, size, dots) {
            ctx.fillStyle = 'white';
            const dotSize = 3;
            const step = size / dots;
            
            // Draw square with dots
            for (let side = 0; side < 4; side++) {
                for (let i = 0; i < dots; i++) {
                    const dotX = x + Math.cos(side * Math.PI / 2) * (i * step);
                    const dotY = y + Math.sin(side * Math.PI / 2) * (i * step);
                    
                    ctx.beginPath();
                    ctx.arc(dotX, dotY, dotSize, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }
        }
        
        function animatePattern() {
            if (!currentPattern) {
                alert('Please generate a pattern first!');
                return;
            }
            
            // Simple animation - rotate the pattern
            let rotation = 0;
            
            function animate() {
                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(rotation * Math.PI / 180);
                ctx.translate(-canvas.width / 2, -canvas.height / 2);
                
                // Clear and redraw
                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                drawSpiralPattern(currentPattern);
                
                ctx.restore();
                
                rotation += 2;
                animationId = requestAnimationFrame(animate);
            }
            
            animate();
        }
        
        function displayPatternInfo(pattern) {
            const patternInfo = document.getElementById('patternInfo');
            const infoGrid = document.getElementById('infoGrid');
            
            const metadata = pattern.metadata;
            
            infoGrid.innerHTML = `
                <div class="info-item">
                    <strong>Type:</strong> ${pattern.type}
                </div>
                <div class="info-item">
                    <strong>Turns:</strong> ${metadata.turns}
                </div>
                <div class="info-item">
                    <strong>Step Angle:</strong> ${metadata.step_angle}°
                </div>
                <div class="info-item">
                    <strong>Step Length:</strong> ${metadata.step_length}px
                </div>
                <div class="info-item">
                    <strong>Total Steps:</strong> ${metadata.total_steps}
                </div>
                <div class="info-item">
                    <strong>Animation:</strong> ${metadata.animation ? 'Yes' : 'No'}
                </div>
                <div class="info-item">
                    <strong>Spiral Color:</strong> ${metadata.colors.spiral}
                </div>
                <div class="info-item">
                    <strong>Squares Color:</strong> ${metadata.colors.squares}
                </div>
            `;
            
            patternInfo.style.display = 'block';
        }
        
        // Generate initial pattern
        window.onload = function() {
            generateSpiralKolam();
        };
    </script>
</body>
</html>
