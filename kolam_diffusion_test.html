<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolam Diffusion Generator</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Babel standalone for JSX transformation
        const { useState } = React;
        
        const KolamDiffusionGenerator = () => {
            const [selectedFile, setSelectedFile] = useState(null);
            const [loading, setLoading] = useState(false);
            const [results, setResults] = useState(null);
            const [error, setError] = useState(null);

            const handleFileSelect = (event) => {
                const file = event.target.files[0];
                if (file) {
                    // Validate file type
                    if (!file.type.startsWith('image/')) {
                        setError('Please select a valid image file');
                        return;
                    }
                    
                    // Validate file size (max 10MB)
                    if (file.size > 10 * 1024 * 1024) {
                        setError('File size must be less than 10MB');
                        return;
                    }
                    
                    setSelectedFile(file);
                    setError(null);
                    setResults(null);
                }
            };

            const handleSubmit = async (event) => {
                event.preventDefault();
                
                if (!selectedFile) {
                    setError('Please select an image file');
                    return;
                }

                setLoading(true);
                setError(null);
                setResults(null);

                try {
                    const formData = new FormData();
                    formData.append('image', selectedFile);

                    const response = await axios.post('http://localhost:5000/generate', formData, {
                        headers: {
                            'Content-Type': 'multipart/form-data',
                        },
                        timeout: 300000, // 5 minutes timeout
                    });

                    if (response.data.success) {
                        setResults(response.data);
                    } else {
                        setError(response.data.error || 'Failed to generate variants');
                    }
                } catch (err) {
                    console.error('Error generating variants:', err);
                    if (err.response) {
                        setError(err.response.data.error || 'Server error');
                    } else if (err.request) {
                        setError('Unable to connect to server. Please check if the API is running.');
                    } else {
                        setError('An unexpected error occurred');
                    }
                } finally {
                    setLoading(false);
                }
            };

            const downloadImage = (url, filename) => {
                const link = document.createElement('a');
                link.href = `http://localhost:5000${url}`;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return React.createElement('div', {
                className: "min-h-screen bg-gradient-to-br from-purple-50 to-pink-50 py-8 px-4"
            }, [
                React.createElement('div', {
                    key: 'container',
                    className: "max-w-6xl mx-auto"
                }, [
                    // Header
                    React.createElement('div', {
                        key: 'header',
                        className: "text-center mb-8"
                    }, [
                        React.createElement('h1', {
                            key: 'title',
                            className: "text-4xl font-bold text-gray-800 mb-4"
                        }, '🎨 Kolam Diffusion Generator'),
                        React.createElement('p', {
                            key: 'subtitle',
                            className: "text-lg text-gray-600 max-w-2xl mx-auto"
                        }, 'Upload a Kolam image and generate 3 unique artistic variants using AI')
                    ]),

                    // Upload Form
                    React.createElement('div', {
                        key: 'form-container',
                        className: "bg-white rounded-2xl shadow-xl p-8 mb-8"
                    }, [
                        React.createElement('form', {
                            key: 'form',
                            onSubmit: handleSubmit,
                            className: "space-y-6"
                        }, [
                            // File Input
                            React.createElement('div', {
                                key: 'file-input'
                            }, [
                                React.createElement('label', {
                                    key: 'label',
                                    className: "block text-sm font-medium text-gray-700 mb-2"
                                }, 'Upload Kolam Image'),
                                React.createElement('input', {
                                    key: 'input',
                                    type: "file",
                                    accept: "image/*",
                                    onChange: handleFileSelect,
                                    className: "block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100 border border-gray-300 rounded-lg cursor-pointer"
                                }),
                                React.createElement('p', {
                                    key: 'help',
                                    className: "text-xs text-gray-500 mt-1"
                                }, 'Supported formats: JPG, PNG, GIF. Max size: 10MB')
                            ]),

                            // Selected File Info
                            selectedFile && React.createElement('div', {
                                key: 'file-info',
                                className: "bg-green-50 border border-green-200 rounded-lg p-4"
                            }, [
                                React.createElement('div', {
                                    key: 'info-content',
                                    className: "flex items-center"
                                }, [
                                    React.createElement('div', {
                                        key: 'icon',
                                        className: "flex-shrink-0"
                                    }, React.createElement('svg', {
                                        className: "h-5 w-5 text-green-400",
                                        viewBox: "0 0 20 20",
                                        fill: "currentColor"
                                    }, React.createElement('path', {
                                        fillRule: "evenodd",
                                        d: "M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z",
                                        clipRule: "evenodd"
                                    }))),
                                    React.createElement('div', {
                                        key: 'text',
                                        className: "ml-3"
                                    }, [
                                        React.createElement('p', {
                                            key: 'name',
                                            className: "text-sm font-medium text-green-800"
                                        }, `Selected: ${selectedFile.name}`),
                                        React.createElement('p', {
                                            key: 'size',
                                            className: "text-xs text-green-600"
                                        }, `Size: ${(selectedFile.size / 1024 / 1024).toFixed(2)} MB`)
                                    ])
                                ])
                            ]),

                            // Error Message
                            error && React.createElement('div', {
                                key: 'error',
                                className: "bg-red-50 border border-red-200 rounded-lg p-4"
                            }, [
                                React.createElement('div', {
                                    key: 'error-content',
                                    className: "flex"
                                }, [
                                    React.createElement('div', {
                                        key: 'error-icon',
                                        className: "flex-shrink-0"
                                    }, React.createElement('svg', {
                                        className: "h-5 w-5 text-red-400",
                                        viewBox: "0 0 20 20",
                                        fill: "currentColor"
                                    }, React.createElement('path', {
                                        fillRule: "evenodd",
                                        d: "M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z",
                                        clipRule: "evenodd"
                                    }))),
                                    React.createElement('div', {
                                        key: 'error-text',
                                        className: "ml-3"
                                    }, React.createElement('p', {
                                        className: "text-sm text-red-800"
                                    }, error))
                                ])
                            ]),

                            // Submit Button
                            React.createElement('button', {
                                key: 'submit',
                                type: "submit",
                                disabled: !selectedFile || loading,
                                className: "w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-semibold py-3 px-6 rounded-lg hover:from-purple-700 hover:to-pink-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 transform hover:scale-105"
                            }, loading ? React.createElement('div', {
                                className: "flex items-center justify-center"
                            }, [
                                React.createElement('svg', {
                                    key: 'spinner',
                                    className: "animate-spin -ml-1 mr-3 h-5 w-5 text-white",
                                    xmlns: "http://www.w3.org/2000/svg",
                                    fill: "none",
                                    viewBox: "0 0 24 24"
                                }, [
                                    React.createElement('circle', {
                                        key: 'circle',
                                        className: "opacity-25",
                                        cx: "12",
                                        cy: "12",
                                        r: "10",
                                        stroke: "currentColor",
                                        strokeWidth: "4"
                                    }),
                                    React.createElement('path', {
                                        key: 'path',
                                        className: "opacity-75",
                                        fill: "currentColor",
                                        d: "M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                                    })
                                ]),
                                'Generating Variants...'
                            ]) : 'Generate Kolam Variants')
                        ])
                    ]),

                    // Results
                    results && React.createElement('div', {
                        key: 'results',
                        className: "bg-white rounded-2xl shadow-xl p-8"
                    }, [
                        React.createElement('div', {
                            key: 'results-header',
                            className: "text-center mb-6"
                        }, [
                            React.createElement('h2', {
                                key: 'results-title',
                                className: "text-2xl font-bold text-gray-800 mb-2"
                            }, 'Generated Kolam Variants'),
                            React.createElement('p', {
                                key: 'session-id',
                                className: "text-gray-600"
                            }, `Session ID: ${results.session_id}`)
                        ]),

                        React.createElement('div', {
                            key: 'images-grid',
                            className: "grid grid-cols-1 md:grid-cols-3 gap-6"
                        }, results.generated_images.map((image, index) => 
                            React.createElement('div', {
                                key: `variant-${index}`,
                                className: "bg-gray-50 rounded-xl p-6"
                            }, [
                                React.createElement('div', {
                                    key: 'variant-header',
                                    className: "mb-4"
                                }, [
                                    React.createElement('h3', {
                                        key: 'variant-title',
                                        className: "text-lg font-semibold text-gray-800 mb-2"
                                    }, `Variant ${image.variant}`),
                                    React.createElement('p', {
                                        key: 'variant-prompt',
                                        className: "text-sm text-gray-600 mb-4"
                                    }, image.prompt)
                                ]),

                                React.createElement('div', {
                                    key: 'image-container',
                                    className: "mb-4"
                                }, React.createElement('img', {
                                    src: `http://localhost:5000${image.url}`,
                                    alt: `Kolam Variant ${image.variant}`,
                                    className: "w-full h-64 object-cover rounded-lg shadow-md hover:shadow-lg transition-shadow duration-200",
                                    onError: (e) => {
                                        e.target.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZjNmNGY2Ii8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzY2NjY2NiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPkltYWdlIG5vdCBmb3VuZDwvdGV4dD48L3N2Zz4=';
                                    }
                                })),

                                React.createElement('div', {
                                    key: 'variant-footer',
                                    className: "flex justify-between items-center"
                                }, [
                                    React.createElement('span', {
                                        key: 'size',
                                        className: "text-xs text-gray-500"
                                    }, `${image.size[0]} × ${image.size[1]}`),
                                    React.createElement('button', {
                                        key: 'download',
                                        onClick: () => downloadImage(image.url, image.filename),
                                        className: "bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition-colors duration-200 text-sm font-medium"
                                    }, 'Download')
                                ])
                            ])
                        ))
                    ]),

                    // Loading State
                    loading && React.createElement('div', {
                        key: 'loading',
                        className: "bg-white rounded-2xl shadow-xl p-8 text-center"
                    }, [
                        React.createElement('div', {
                            key: 'loading-content',
                            className: "flex flex-col items-center"
                        }, [
                            React.createElement('svg', {
                                key: 'loading-spinner',
                                className: "animate-spin h-12 w-12 text-purple-600 mb-4",
                                xmlns: "http://www.w3.org/2000/svg",
                                fill: "none",
                                viewBox: "0 0 24 24"
                            }, [
                                React.createElement('circle', {
                                    key: 'loading-circle',
                                    className: "opacity-25",
                                    cx: "12",
                                    cy: "12",
                                    r: "10",
                                    stroke: "currentColor",
                                    strokeWidth: "4"
                                }),
                                React.createElement('path', {
                                    key: 'loading-path',
                                    className: "opacity-75",
                                    fill: "currentColor",
                                    d: "M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                                })
                            ]),
                            React.createElement('h3', {
                                key: 'loading-title',
                                className: "text-xl font-semibold text-gray-800 mb-2"
                            }, 'Generating Your Kolam Variants'),
                            React.createElement('p', {
                                key: 'loading-text',
                                className: "text-gray-600 mb-4"
                            }, 'This may take 1-3 minutes depending on your hardware...'),
                            React.createElement('div', {
                                key: 'progress-bar',
                                className: "w-full bg-gray-200 rounded-full h-2"
                            }, React.createElement('div', {
                                className: "bg-gradient-to-r from-purple-600 to-pink-600 h-2 rounded-full animate-pulse"
                            }))
                        ])
                    ])
                ])
            ]);
        };

        // Render the component
        ReactDOM.render(React.createElement(KolamDiffusionGenerator), document.getElementById('root'));
    </script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
